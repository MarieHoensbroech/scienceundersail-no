<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- GA4 via GTM: lastes kun inn etter samtykke i cookie-banneren (jf. /personvern/) -->
  <script>
    (function () {
      var GTM_ID = 'GTM-KTRBC4SF';
      var KEY = 'sus-cookie-consent';

      function loadGtm() {
        if (window.susGtmLoaded) return;
        window.susGtmLoaded = true;
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
        document.head.appendChild(s);
      }

      function getConsent() {
        try { return localStorage.getItem(KEY); } catch (e) { return null; }
      }

      function setConsent(value) {
        try { localStorage.setItem(KEY, value); } catch (e) {}
        hideBanner();
        if (value === 'granted') loadGtm();
      }

      function showBanner() {
        var b = document.getElementById('sus-cookie-banner');
        if (b) b.hidden = false;
      }

      function hideBanner() {
        var b = document.getElementById('sus-cookie-banner');
        if (b) b.hidden = true;
      }

      function injectBanner() {
        if (document.getElementById('sus-cookie-banner')) return;
        var b = document.createElement('div');
        b.id = 'sus-cookie-banner';
        b.setAttribute('role', 'region');
        b.setAttribute('aria-label', 'Informasjonskapsler');
        b.hidden = true;
        b.innerHTML =
          '<p class="sus-cookie-text">Vi bruker informasjonskapsler til anonym ' +
          'brukerstatistikk (Google Analytics). De settes bare dersom du samtykker. ' +
          '<a href="{{ \'/personvern/\' | relative_url }}">Les mer i personvernerklæringen</a>.</p>' +
          '<div class="sus-cookie-actions">' +
          '<button type="button" id="sus-consent-accept">Godta statistikk</button>' +
          '<button type="button" id="sus-consent-decline">Bare nødvendige</button>' +
          '</div>';
        document.body.appendChild(b);
      }

      document.addEventListener('click', function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        if (t.closest('#sus-consent-accept')) {
          setConsent('granted');
        } else if (t.closest('#sus-consent-decline')) {
          setConsent('denied');
        } else if (t.closest('#sus-cookie-settings-link')) {
          e.preventDefault();
          try { localStorage.removeItem(KEY); } catch (err) {}
          showBanner();
        }
      });

      function init() {
        injectBanner();
        var c = getConsent();
        if (c === 'granted') {
          loadGtm();
        } else if (c !== 'denied') {
          showBanner();
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>

  <style>
    #sus-cookie-banner {
      position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 10000;
      max-width: 640px; margin: 0 auto; padding: 16px 20px;
      background: #0c1c23; color: #fff; border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
      font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px; line-height: 1.5;
    }
    #sus-cookie-banner[hidden] { display: none; }
    #sus-cookie-banner a { color: #9fd4e8; text-decoration: underline; }
    .sus-cookie-text { margin: 0; }
    .sus-cookie-actions { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
    .sus-cookie-actions button {
      padding: 8px 16px; border-radius: 4px; border: 1px solid #fff;
      background: #fff; color: #0c1c23; font-size: 14px; cursor: pointer;
    }
    .sus-cookie-actions #sus-consent-decline { background: transparent; color: #fff; }
  </style>

  <meta name="description" content="{{ page.description | default: site.description | default: '' }}">
  <meta name="author" content="{{ site.author | default: '' }}">

  {%- if page.url == "/" or page.title == blank -%}
  <title>{{ site.title | default: "Science under Sail" }}</title>
  {%- else -%}
  <title>{{ page.title }} | {{ site.title }}</title>
  {%- endif -%}

  <!-- Canonical & language alternates -->
  {%- assign canon = page.url | default: "/" -%}
  <link rel="canonical" href="{{ site.url }}{{ canon }}">
  {%- if canon == "/" -%}
  <link rel="alternate" hreflang="no" href="{{ site.url }}/">
  <link rel="alternate" hreflang="en" href="https://scienceundersail.org/">
  <link rel="alternate" hreflang="x-default" href="https://scienceundersail.org/">
  {%- endif -%}

  <!-- Open Graph / Twitter -->
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="nb_NO">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | default: '' }}">
  <meta property="og:url" content="{{ site.url }}{{ canon }}">
  <meta property="og:image" content="{{ site.url }}/img/icon/logo.png">
  <meta name="twitter:card" content="summary">

  <!-- Favicon (ICO) -->
  <link rel="icon" href="{{ '/img/icon/logo.ico?v=2' | relative_url }}" type="image/x-icon">
  <link rel="shortcut icon" href="{{ '/img/icon/logo.ico' | relative_url }}type=image/x-icon">

  <!-- Apple touch icon (PNG recommended, ideally 180x180) -->
  <link rel="apple-touch-icon" href="{{ '/img/icon/logo.png' | relative_url }}">

  <!-- Bootstrap Core CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/css/bootstrap.min.css" type="text/css">

  <!-- Custom Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Merriweather:400,300,600,700,800,400italic,300italic,700italic,800italic" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="{{ site.baseurl }}/font-awesome/css/font-awesome.min.css" type="text/css">

  <!-- Academicons (for ORCID, ResearchGate, iNaturalist, etc.) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1.9.4/css/academicons.min.css" type="text/css">

  <!-- Plugin CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/css/animate.min.css" type="text/css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/css/main.css" type="text/css">

  <!-- Strukturert data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "name": "Science under Sail",
        "url": "https://scienceundersail.no/",
        "logo": "https://scienceundersail.no/img/icon/logo.png",
        "description": "Seilbåtbasert økologisk feltarbeid, dataanalyse og forskningsstøtte/ekspedisjoner i Skandinavia og Europa.",
        "areaServed": [
          { "@type": "Place", "name": "Vestland, Norge" },
          { "@type": "Place", "name": "Spania" },
          { "@type": "Place", "name": "Skandinavia" },
          { "@type": "Place", "name": "Europa" }
        ]
      },
      {
        "@type": "WebSite",
        "url": "https://scienceundersail.no/",
        "name": "Science under Sail",
        "inLanguage": "nb"
      }
    ]
  }
  </script>
