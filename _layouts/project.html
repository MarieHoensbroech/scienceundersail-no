<!DOCTYPE html>
<html lang="nb">

{% include head.html %}
<link rel="stylesheet" href="{{ site.baseurl }}/css/project.css?v=20261109" type="text/css">

<body id="page-top">

  {% include nav.html %}

  <header class="project-header"{% if page.header_image %} style="background-image: linear-gradient(rgba(12, 28, 35, 0.35), rgba(12, 28, 35, 0.68)), url('{{ site.baseurl }}/img/{{ page.header_image }}');"{% endif %}>
    <div class="project-header-content">
      <h1>{{ page.title }}</h1>

      <hr>

      {% if page.subtitle %}
        <p>{{ page.subtitle }}</p>
      {% endif %}
    </div>
  </header>

  <main class="project-content">
    {{ content }}
  </main>

  {% include contact.html %}
  {% include credits.html %}
  {% include scripts.html %}

</body>
</html>
