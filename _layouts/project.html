<!DOCTYPE html>
<html lang="no">

{% include head.html %}

<head>
  {{ '/css/project.css' | relative_url }}
</head>

<body id="page-top">

  {% include nav.html %}

  <header class="project-header">
    <div class="project-header-content">
      <h1>{{ page.title }}</h1>

      {% if page.subtitle %}
        <hr class="primary">
        <p>{{ page.subtitle }}</p>
      {% endif %}
    </div>
  </header>

  <main class="project-content">
    {{ content }}
  </main>

  {% include scripts.html %}

</body>
</html>
